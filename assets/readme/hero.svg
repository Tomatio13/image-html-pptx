    <text x="18" y="196" fill="#60758A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">complex art stays movable</text>
    <text x="18" y="226" fill="#1E5A88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">INPUT · PNG/JPEG/WebP</text>
    <path d="M207 134H279" stroke="#1E5A88" stroke-width="3" stroke-linecap="round"/>
    <path d="M270 126l12 8-12 8" fill="none" stroke="#1E5A88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
