<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Image to Editable PPTX</title>
  <desc id="desc">スライド画像をHTMLと計測済みDOMを介して、テキストと図形を編集できるPowerPointへ変換するAgent Skill。</desc>
  <rect width="1200" height="400" rx="28" fill="#F6F9FC"/>
  <path d="M64 82H594" stroke="#D8E2EB" stroke-width="2"/>
  <circle cx="64" cy="82" r="5" fill="#1E5A88"/>
  <text x="84" y="90" fill="#1E5A88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="2">AGENT SKILL · IMAGE → EDITABLE PPTX</text>
  <text x="64" y="166" fill="#121A22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800">Image to</text>
  <text x="64" y="230" fill="#1E5A88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800">Editable PPTX</text>
  <text x="64" y="280" fill="#425466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600">スライド画像を、あとから直せる資料へ。</text>
  <text x="64" y="314" fill="#60758A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">HTML/CSSを中間成果物にして、確定したレイアウトを変換します。</text>
  <rect x="64" y="338" width="336" height="36" rx="18" fill="#E2EFF8"/>
  <text x="84" y="362" fill="#1E5A88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">text · cards · lines · charts</text>
  <g transform="translate(670 54)">
    <text x="0" y="-12" fill="#60758A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">RECONSTRUCTION FLOW</text>
    <rect x="0" y="0" width="184" height="268" rx="16" fill="#FFFFFF" stroke="#B7C8D7" stroke-width="2"/>
    <rect x="18" y="22" width="148" height="112" rx="9" fill="#193C58"/>
    <rect x="31" y="38" width="74" height="10" rx="5" fill="#77CAE7"/>
