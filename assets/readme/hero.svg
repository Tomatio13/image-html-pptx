    <rect x="314" y="22" width="148" height="112" rx="8" fill="#F4F8FB" stroke="#7EA5BF" stroke-width="2"/>
    <rect x="330" y="40" width="78" height="12" rx="6" fill="#1E5A88"/>
    <rect x="330" y="67" width="112" height="20" rx="5" fill="#DCECF5"/>
