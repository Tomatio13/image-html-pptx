<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Noto Sans CJK JP", sans-serif;
      }
    </style>
  </head>
  <body>
    <section class="slide" style="background: #f7f4ee">
      <div
        style="
          position: absolute;
          left: 96px;
          top: 96px;
          width: 12px;
          height: 112px;
          background: #d45b36;
        "
      ></div>
      <h1
        style="
          position: absolute;
          left: 140px;
          top: 96px;
          margin: 0;
          color: #1f2933;
          font-size: 72px;
        "
      >
        編集可能なスライド
      </h1>
      <p
        style="
          position: absolute;
          left: 140px;
          top: 210px;
          margin: 0;
          color: #52606d;
          font-size: 32px;
        "
      >
        日本語テキストと図形を保持します
      </p>
      <div
        style="
          position: absolute;
          left: 140px;
          top: 360px;
          width: 480px;
          height: 300px;
          border-radius: 32px;
          background: #ffffff;
          border: 3px solid #d9e2ec;
        "
      ></div>
      <p
        style="
          position: absolute;
          left: 190px;
          top: 420px;
          margin: 0;
          color: #d45b36;
          font-size: 28px;
          font-weight: 700;
        "
      >
        KPI
      </p>
      <p
        style="
          position: absolute;
          left: 190px;
          top: 485px;
          margin: 0;
          color: #1f2933;
          font-size: 80px;
          font-weight: 700;
        "
      >
        128%
      </p>
    </section>
    <section class="slide" style="background: #132238">
      <h2
        style="
          position: absolute;
          left: 120px;
          top: 100px;
          margin: 0;
          color: #ffffff;
          font-size: 64px;
        "
      >
        処理フロー
      </h2>
      <div
        style="
          position: absolute;
          left: 140px;
          top: 400px;
          width: 360px;
          height: 160px;
          border-radius: 24px;
          background: #ffffff;
        "
      ></div>
      <p
        style="
          position: absolute;
          left: 220px;
          top: 455px;
          margin: 0;
          color: #132238;
          font-size: 36px;
        "
      >
        画像解析
      </p>
      <div
        style="
          position: absolute;
          left: 620px;
          top: 474px;
          width: 220px;
          height: 8px;
          background: #6bd5d2;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 960px;
          top: 400px;
          width: 500px;
          height: 160px;
          border-radius: 24px;
          background: #6bd5d2;
        "
      ></div>
      <p
        style="
          position: absolute;
          left: 1060px;
          top: 455px;
          margin: 0;
          color: #132238;
          font-size: 36px;
        "
      >
        編集可能PPTX
      </p>
    </section>
  </body>
</html>
